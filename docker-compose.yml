services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: anp-engine-rrs-backend
    env_file:
      - .env
    environment:
      API_PORT: 3001
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: /app/data/horror.db
    ports:
      - "3001:3001"
    volumes:
      - rrs_data:/app/data
      - rrs_media:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anp-engine-rrs-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  rrs_data:
  rrs_media:
