services:
  rrs:
    build: .
    container_name: engine-rrs
    # hanya bisa dibuka dari laptop ini (bukan dari jaringan)
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./data:/data        # database, gambar, avatar, musik, video hasil
    restart: unless-stopped
